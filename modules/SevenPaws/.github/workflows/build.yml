name: Build bundles

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: rustup target add ${{ matrix.target }}

      - name: Build NSIS (${{ matrix.arch }})
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/7paws.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ("${{ matrix.arch }}" -eq "x64") { 0x8664 } else { 0xAA64 }
          if ($machine -ne $expected) {
            throw ("Unexpected PE machine 0x{0:X4}" -f $machine)
          }
          Write-Host ("PE machine OK: 0x{0:X4}" -f $machine)

      - name: Package portable zip (${{ matrix.arch }})
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $release = "src-tauri/target/${{ matrix.target }}/release"
          $out = Join-Path $release "bundle/portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path (Join-Path $release "7paws.exe") -DestinationPath (Join-Path $out "7paws_${version}_${{ matrix.arch }}-portable.zip") -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/portable/*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
            file_arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
            file_arch: arm64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: rustup target add ${{ matrix.target }}

      - name: Build DMG (${{ matrix.arch }})
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Verify Mach-O architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="src-tauri/target/${{ matrix.target }}/release/7paws"
          file "${binary}"
          file "${binary}" | grep -q "${{ matrix.file_arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-bundle
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error