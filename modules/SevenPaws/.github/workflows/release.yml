name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check tag and versions
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          tauri="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          cargo_lock="$(awk '/^name = "seven-paws"$/{f=1; next} f && /^version = /{gsub(/version = |"/, ""); print; exit}' src-tauri/Cargo.lock)"
          echo "tag=${tag} package=${pkg} package-lock=${lock} tauri=${tauri} cargo=${cargo} cargo-lock=${cargo_lock}"
          test "${tag}" = "${pkg}"
          test "${tag}" = "${lock}"
          test "${tag}" = "${tauri}"
          test "${tag}" = "${cargo}"
          test "${tag}" = "${cargo_lock}"

  build-windows:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: rustup target add ${{ matrix.target }}

      - name: Build NSIS (${{ matrix.arch }})
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/7paws.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ("${{ matrix.arch }}" -eq "x64") { 0x8664 } else { 0xAA64 }
          if ($machine -ne $expected) {
            throw ("Unexpected PE machine 0x{0:X4}" -f $machine)
          }
          Write-Host ("PE machine OK: 0x{0:X4}" -f $machine)

      - name: Package portable zip (${{ matrix.arch }})
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $release = "src-tauri/target/${{ matrix.target }}/release"
          $out = Join-Path $release "bundle/portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path (Join-Path $release "7paws.exe") -DestinationPath (Join-Path $out "7paws_${version}_${{ matrix.arch }}-portable.zip") -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/portable/*.zip
          if-no-files-found: error

  build-windows-7:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-win7
          key: win7-x64

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build Windows 7 compatibility executable
        run: cargo build --release --locked --features win7 --target-dir target-win7
        working-directory: src-tauri

      - name: Verify and package Windows 7 portable
        shell: pwsh
        run: ./scripts/package-win7.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows-win7-bundle
          path: src-tauri/target-win7/release/bundle/portable/*-win7-x64-portable.zip
          if-no-files-found: error

  build-macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
            file_arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
            file_arch: arm64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      - run: rustup target add ${{ matrix.target }}

      - name: Build DMG (${{ matrix.arch }})
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Verify Mach-O architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="src-tauri/target/${{ matrix.target }}/release/7paws"
          file "${binary}"
          file "${binary}" | grep -q "${{ matrix.file_arch }}"

      - name: Verify code signature
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/7paws.app"
          codesign -dv --verbose=4 "${app}" 2>&1 | tee codesign.txt
          grep -q "Identifier=com.qoder.7paws" codesign.txt
          if grep -q "Info.plist=not bound" codesign.txt; then
            echo "the app bundle is not signed with its Info.plist bound" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-bundle
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [build-windows, build-windows-7, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -mindepth 2 -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*-portable.zip' \) -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          ls -l release
          test "$(find release -name '*-setup.exe' | wc -l)" -eq 2
          test "$(find release -name '*.dmg' | wc -l)" -eq 2
          test "$(find release -name '*-portable.zip' | wc -l)" -eq 3
          test "$(find release -name '*-win7-x64-portable.zip' | wc -l)" -eq 1

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ ! -s release-notes.md ]; then
            printf '7paws %s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          if [ -n "${prev}" ]; then
            printf '\n**完整改动**：https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 7paws ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true