[package]
name = "seven-paws"
version = "0.4.2"
description = "7paws desktop cat companion"
authors = ["7paws"]
license = "MIT"
edition = "2021"

[lib]
name = "seven_paws_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "7paws"
path = "src/main.rs"

[features]
default = []
win7 = ["tauri/custom-protocol", "dep:oldwin", "dep:oldwin-targets", "dep:cc"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = { version = "1", optional = true }
oldwin = { version = "=0.2.1", default-features = false, features = ["win7", "yy-thunks", "vc-ltl5", "hidden-build-warning"], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
oldwin-targets = { version = "=0.2.1", default-features = false, features = ["win7", "yy-thunks", "vc-ltl5"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
